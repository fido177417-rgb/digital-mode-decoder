name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Android SDK
      run: |
        echo "y" | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
    
    - name: Compile Java
      run: |
        mkdir -p bin/classes
        javac -source 1.8 -target 1.8 \
          -classpath $ANDROID_HOME/platforms/android-34/android.jar \
          -d bin/classes \
          android_build/src/com/digitalmodedecoder/MainActivity.java
    
    - name: Convert to DEX
      run: |
        $ANDROID_HOME/build-tools/34.0.0/d8 \
          --output bin \
          --lib $ANDROID_HOME/platforms/android-34/android.jar \
          bin/classes/com/digitalmodedecoder/MainActivity.class
    
    - name: Package APK
      run: |
        mkdir -p bin/gen
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m \
          -S android_build/res \
          -J bin/gen \
          -M android_build/AndroidManifest.xml \
          -I $ANDROID_HOME/platforms/android-34/android.jar \
          --auto-add-overlay
        
        $ANDROID_HOME/build-tools/34.0.0/aapt link -f \
          -o bin/dmd-unsigned.apk \
          -I $ANDROID_HOME/platforms/android-34/android.jar \
          -S android_build/res \
          -M android_build/AndroidManifest.xml \
          --auto-add-overlay
        
        cd bin && zip -j dmd-unsigned.apk classes.dex && cd ..
        
        $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 bin/dmd-unsigned.apk bin/dmd-aligned.apk
    
    - name: Sign APK
      run: |
        keytool -genkeypair -v \
          -keystore bin/debug.keystore \
          -alias debug \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Debug,O=Debug,C=US"
        
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks bin/debug.keystore \
          --ks-key-alias debug \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out bin/dmd-debug.apk \
          bin/dmd-aligned.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: dmd-debug
        path: bin/dmd-debug.apk
